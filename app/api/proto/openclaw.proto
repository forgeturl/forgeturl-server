syntax = "proto3";

option go_package = "api/openclaw";

import "google/api/annotations.proto";
import "google/api/client.proto";

service OpenClawService {
  rpc GetApiKey(GetApiKeyReq) returns (GetApiKeyResp) {
    option (google.api.http) = {
      post: "/openclaw/getApiKey"
      body: "*"
    };
  }

  rpc RegenerateApiKey(RegenerateApiKeyReq) returns (RegenerateApiKeyResp) {
    option (google.api.http) = {
      post: "/openclaw/regenerateApiKey"
      body: "*"
    };
  }

  rpc AddTmpBookmark(AddTmpBookmarkReq) returns (AddTmpBookmarkResp) {
    option (google.api.http) = {
      post: "/openclaw/tmpBookmark/add"
      body: "*"
    };
  }

  rpc ListTmpBookmarks(ListTmpBookmarksReq) returns (ListTmpBookmarksResp) {
    option (google.api.http) = {
      post: "/openclaw/tmpBookmark/list"
      body: "*"
    };
  }

  rpc ExistsTmpBookmark(ExistsTmpBookmarkReq) returns (ExistsTmpBookmarkResp) {
    option (google.api.http) = {
      post: "/openclaw/tmpBookmark/exists"
      body: "*"
    };
  }

  rpc MoveTmpBookmarkToPage(MoveTmpBookmarkToPageReq) returns (EmptyResp) {
    option (google.api.http) = {
      post: "/openclaw/tmpBookmark/moveToPage"
      body: "*"
    };
  }

  rpc MovePageBookmarkToTmp(MovePageBookmarkToTmpReq) returns (EmptyResp) {
    option (google.api.http) = {
      post: "/openclaw/tmpBookmark/moveFromPage"
      body: "*"
    };
  }
}

message GetApiKeyReq {}

message GetApiKeyResp { // omitempty=false
  bool has_key = 1;
  string api_key = 2;
}

message RegenerateApiKeyReq {}

message RegenerateApiKeyResp { // omitempty=false
  string api_key = 1;
}

message TmpBookmark { // omitempty=false
  int64 id = 1;
  string title = 2;
  string url = 3;
  int64 create_at = 4;
  int64 update_at = 5;
}

message AddTmpBookmarkReq {
  string title = 1; // binding:"required,min=1,max=256"
  string url = 2; // binding:"required,min=1,max=2048"
}

message AddTmpBookmarkResp { // omitempty=false
  TmpBookmark bookmark = 1;
}

message ListTmpBookmarksReq {
  int32 limit = 1; // binding:"min=0,max=500"
}

message ListTmpBookmarksResp { // omitempty=false
  repeated TmpBookmark bookmarks = 1;
}

message ExistsTmpBookmarkReq {
  string title = 1; // binding:"required,min=1,max=256"
  string url = 2; // binding:"required,min=1,max=2048"
}

message ExistsTmpBookmarkResp { // omitempty=false
  bool exists = 1;
  TmpBookmark bookmark = 2;
}

message MoveTmpBookmarkToPageReq {
  int64 bookmark_id = 1; // binding:"required,min=1"
  string page_id = 2; // binding:"required,min=1,max=64"
  string collection_title = 3; // binding:"max=256"
}

message MovePageBookmarkToTmpReq {
  string page_id = 1; // binding:"required,min=1,max=64"
  string collection_title = 2; // binding:"max=256"
  string title = 3; // binding:"required,min=1,max=256"
  string url = 4; // binding:"required,min=1,max=2048"
}

message EmptyResp {}
